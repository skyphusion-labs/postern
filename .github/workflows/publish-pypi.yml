name: Publish PyPI package

# Publish postern-client when a v* tag is pushed (same tag as deploy.yml and
# release.yml). Do not trigger on release: published: releases created by
# softprops/action-gh-release with GITHUB_TOKEN do not fire that webhook.
#
# AUTH MODEL (#418 item 7): API-token publishing, one model, no dead
# alternative. The job previously requested `id-token: write` for PyPI trusted
# publishing but always took the token path (a `password:` wins), so the OIDC
# permission was pure surface with no effect. Trusted publishing is the better
# end state, but flipping to it needs a publisher configured on the PyPI project
# first, at pypi.org, by the account owner; removing the token before that would
# simply break the next release. Filed as a follow-up, not silently half-done.
#
# `skip-existing: true` makes a re-run safe: after a partial publish (or a
# workflow_dispatch recovery run on an already-published version) the upload of
# an existing file is a no-op instead of a hard 400.
#
# Required repo secret: PYPI_API_TOKEN.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Shared gate (#418): tag-vs-pins lockstep (pyproject, __version__,
  # inbound/package.json), the CHANGELOG section, and tag-on-main ancestry, all
  # asserted once, for every tag workflow, before any of them acts. On a
  # workflow_dispatch there is no tag to compare against, so the preflight
  # instead asserts the three pins agree with each other, which keeps a recovery
  # publish off a half-bumped tree.
  preflight:
    uses: ./.github/workflows/tag-preflight.yml
    with:
      track: release

  publish:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        working-directory: clients/python
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: clients/python/dist
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

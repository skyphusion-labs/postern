name: Publish PyPI package

# Publish postern-client when a v* tag is pushed (same tag as deploy.yml and
# release.yml). Do not trigger on release: published: releases created by
# softprops/action-gh-release with GITHUB_TOKEN do not fire that webhook.
#
# AUTH MODEL: PyPI Trusted Publishing (OIDC), one model, no token. The publish
# job runs in the GitHub Environment `production` and presents the Actions OIDC
# token; PyPI accepts it only for the publisher configured on the postern-client
# project: owner skyphusion-labs, repository postern, workflow publish-pypi.yml,
# environment production. There is no `password:`, so no long-lived token is
# read. The action also uploads PEP 740 attestations. Renaming this file, or
# changing the environment name, breaks that trust until PyPI is updated.
#
# `skip-existing: true` makes a re-run safe: after a partial publish (or a
# workflow_dispatch recovery run on an already-published version) the upload of
# an existing file is a no-op instead of a hard 400.
#
# Required: the PyPI trusted publisher above, and the `production` Environment.
# No secret.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Shared gate (#418): tag-vs-pins lockstep (pyproject, __version__,
  # inbound/package.json), the CHANGELOG section, and tag-on-main ancestry, all
  # asserted once, for every tag workflow, before any of them acts. On a
  # workflow_dispatch there is no tag to compare against, so the preflight
  # instead asserts the three pins and inbound/src/version.ts agree with each other, which keeps a recovery
  # publish off a half-bumped tree.
  preflight:
    uses: ./.github/workflows/tag-preflight.yml
    with:
      track: release

  publish:
    needs: preflight
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://pypi.org/p/postern-client
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        working-directory: clients/python
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: clients/python/dist
          skip-existing: true

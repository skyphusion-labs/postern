name: CodeQL

# Estate standard: in-repo CodeQL for JS/TS + Actions. PR trigger unfiltered so
# stacked PRs still get analysis. Schedule weekly.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "20 4 * * 0"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: matrix.language == 'javascript-typescript'
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        if: matrix.language == 'javascript-typescript'
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci
          elif [ -f package.json ]; then npm install
          else echo "no package.json; skipping install"
          fi
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

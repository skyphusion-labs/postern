name: relay-image

# Build the postern-relay door image and push it to GHCR.
#
# WHY: the Go relay (587 submission door + loopback intake) ships as a versioned
# container image rather than a host systemd install, the same move the 993 IMAP door made
# (#150/#152). The image is the unit of deploy, tagged by immutable git short-SHA so any
# orchestrator can pin an exact build.
#
# NO DEPLOY LANE (2026-09-24). This workflow builds and PUBLISHES; nothing rolls the
# image onto a host, because the host is gone. The Swarm host that ran the door services,
# and the fleet-chezmoi `postern-door-roll` handler this workflow used to dispatch, were
# both released with the Hetzner cut (#2066 over there). The recipe is kept in
# `.github/scripts/dispatch-fleet-postern-door-roll.sh`, which fails closed and documents
# what re-enabling needs; it just has no caller any more. Where the door tier runs next is
# a spend and topology decision, so nothing here guesses at one.
#
# Production receiving is unaffected: that is CF Email Routing -> the inbound Worker, and it
# never involved these images.
#
# ARTIFACT SMOKE (#543): `build` loads the image and asserts the binary binds and answers
# an SMTP greeting with stub inbound env, so a non-starting image cannot be published. This
# gate is now the LAST one in the workflow, which makes it the only thing standing between a
# broken build and a tag-named image on GHCR; it earns its place more than it did when a
# roll job sat behind it.
#
# Triggers:
#   - push to main that touches relay/** (or this workflow): rebuild on real
#     changes, not on every unrelated main push.
#   - a v* tag: cut a release-tagged image.
#   - workflow_dispatch: a reliable manual build (also the dependable path for a
#     release tag whose commit did not itself change relay/**, since GitHub ANDs the
#     paths filter onto tag pushes).
#
# ORDERING (#418): the shared `preflight` job runs first and every job below
# depends on it (transitively), so a tag-hostile release cannot build and
# roll-dispatch a door image while the release + publish workflows fail. On the
# v1.0.5 cut, BOTH door images built and rolled off a tag that could not produce
# a release. The per-job "is this commit on main" asserts this workflow used to
# carry three copies of now live in that one gate.
#
# Runner: GitHub-hosted ubuntu-latest. PUBLIC repo -> fork-safe hosted runner, per
# the house CI policy (matches ci.yml / deploy.yml / imap-image.yml). The image is a
# slim Debian base, so no disk-reclaim step is needed.
on:
  push:
    branches: [main]
    paths:
      - 'relay/**'
      - '.github/workflows/relay-image.yml'
    tags:
      - 'v*'
  workflow_dispatch: {}

# Least privilege: read the repo, write GHCR packages. Nothing else.
permissions:
  contents: read
  packages: write

# A newer push to the same ref supersedes an in-flight build.
concurrency:
  group: relay-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/skyphusion-labs/postern-relay

jobs:

  # Shared tag gate (#418): commit-on-main ancestry on every ref, plus the full
  # tag lockstep (version pins, CHANGELOG section) when the ref is a v* tag.
  preflight:
    uses: ./.github/workflows/tag-preflight.yml
    with:
      track: release

  # Gate: the same core checks ci.yml runs for the relay (vet + build + the
  # race-enabled test suite, incl. the email-injection regression guards), so the
  # image is only built from code that passes the project gate. CI parity is the
  # house convention. The image is cgo-free (CGO_ENABLED=0), matching the Dockerfile
  # build, so `system`/PAM is intentionally not exercised here.
  gate:
    needs: preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The relay govulncheck gate below measures the toolchain it runs under, and
      # setup-go resolves that from relay/go.mod. relay/Dockerfile names a Go
      # version too, and for months it named a DIFFERENT one, so a green relay job
      # said nothing true about the shipped image (#704). Assert they agree before
      # spending a runner on the rest, and fail loudly when they do not.
      - name: scanned Go == shipped Go (#704)
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/assert-relay-go-pin.sh
      - uses: actions/setup-go@v7
        with:
          # Track the relay go.mod toolchain so CI never drifts from the code.
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - run: go vet ./...
      - env:
          CGO_ENABLED: "0"
        run: go build ./...
      - run: go test -race ./...

  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # Immutable git short-SHA (bare, the pin target for `service update
          # --image`), a moving `latest` on the default branch, and the v* tag on a
          # release.
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./relay
          file: ./relay/Dockerfile
          # load=true so the smoke step can `docker run` the artifact on this
          # runner (#543). Single-platform; compatible with push.
          load: true
          push: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The runtime target is x86_64; a single linux/amd64 image keeps the GHCR
          # package and the short-SHA digest clean for swarm pinning.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # #543: verify the ARTIFACT. The binary must exist, start with stub inbound
      # env, bind SMTP_LISTEN, and answer a 220 greeting. No real worker, no TLS
      # submission, no credentials beyond a dummy transport token.
      - name: Artifact smoke
        run: |
          set -euo pipefail
          tag="${GITHUB_SHA:0:7}"
          image="${{ env.IMAGE }}:${tag}"
          echo "smoke: image=${image}"

          echo "smoke: binary present and executable"
          docker run --rm --entrypoint /bin/sh "$image" -c \
            'test -x /usr/local/bin/postern-relay'

          name="postern-relay-smoke-${GITHUB_SHA:0:7}"
          cleanup() { docker rm -f "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          # Inbound-only stub: POSTERN_INGEST_URL + token activates intake.
          # Intake must bind loopback only (relay F4 invariant -- a public bind is
          # an open injection door). Use --network host so the runner can reach
          # 127.0.0.1:2525 inside the container namespace.
          docker run -d --name "$name" --network host \
            -e POSTERN_INGEST_URL=http://127.0.0.1:9/ingest \
            -e POSTERN_TRANSPORT_TOKEN=smoke \
            -e SMTP_LISTEN=127.0.0.1:2525 \
            "$image"

          greeting=""
          for _ in $(seq 1 30); do
            if greeting=$(timeout 2 bash -c 'exec 3<>/dev/tcp/127.0.0.1/2525; IFS= read -r line <&3; printf %s "$line"' 2>/dev/null); then
              if printf '%s\n' "$greeting" | grep -qE '^220 '; then
                echo "smoke: SMTP greeting ok: ${greeting}"
                exit 0
              fi
            fi
            if ! docker inspect -f '{{.State.Running}}' "$name" 2>/dev/null | grep -q true; then
              echo "smoke: container exited before greeting" >&2
              docker logs "$name" >&2 || true
              exit 1
            fi
            sleep 0.5
          done
          echo "smoke: no SMTP 220 greeting from ${image}" >&2
          docker logs "$name" >&2 || true
          exit 1


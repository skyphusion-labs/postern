name: npm-mcp

# Publish @skyphusion/postern-mcp to the public npm registry.
# Tag push: git tag postern-mcp-v1.1.1 && git push origin postern-mcp-v1.1.1
# The tag must equal mcp/package.json version, on a commit already on main.
# Or: workflow_dispatch, which publishes the version in mcp/package.json. The
# preflight only lets a dispatch through when that version EQUALS the newest
# postern-mcp-v* tag (behind or ahead fails), so it re-publishes an already
# tagged version and cannot ship an untagged bump.
#
# The MCP server rides its OWN tag track (postern-mcp-v*), separate from the v*
# train that ships the inbound Worker, postern-client, and the door images. By
# convention those tags cut no GitHub Release and get no CHANGELOG.md section;
# the npm registry is this train's ledger (stated in the CHANGELOG preamble).
#
# Auth is npm trusted publishing (OIDC). npmjs.com trusts this filename
# (npm-mcp.yml) and no GitHub environment. The publish job presents the
# Actions OIDC token. It does not read NPM_TOKEN: a configured token is
# the fallback, and the one this repo still holds is dead. Renaming this
# file, or setting environment: on the publish job, breaks that trust.
# npm CLI 11.5.1 or newer is required for the exchange. Node 22 ships an
# older npm, so the publish step installs npm 11 first. The build and the
# tests stay on the Node 22 toolchain the rest of CI uses.

on:
  push:
    tags:
      - "postern-mcp-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # The gate this workflow never had (#418 item 3): the Python sibling's
  # tag-vs-version assert is exactly what caught the v1.0.5 pin drift, and an npm
  # publish is irreversible for a given version. It also carries the ancestry
  # assert that used to be inlined in the publish job.
  preflight:
    uses: ./.github/workflows/tag-preflight.yml
    with:
      track: mcp

  publish:
    name: npm publish @skyphusion/postern-mcp
    needs: preflight
    runs-on: ubuntu-latest
    # Job permissions replace the workflow set. id-token has to be on this
    # job or GitHub will not mint the OIDC token npm exchanges.
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run typecheck && npm test && npm run build

      - name: Publish to npm
        run: |
          npm install -g npm@^11.5.1
          npm --version
          npm publish --access public --provenance

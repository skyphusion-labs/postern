name: npm-mcp

# Publish @skyphusion/postern-mcp to the public npm registry.
# Tag push: git tag postern-mcp-v1.1.1 && git push origin postern-mcp-v1.1.1
# Or: workflow_dispatch (uses version in mcp/package.json).
#
# The MCP server rides its OWN tag track (postern-mcp-v*), separate from the v*
# train that ships the inbound Worker, postern-client, and the door images. By
# convention those tags cut no GitHub Release and get no CHANGELOG.md section;
# the npm registry is this train's ledger (stated in the CHANGELOG preamble).
#
# Required repo secret: NPM_TOKEN (npmjs.com automation token with publish scope
# for the @skyphusion org).

on:
  push:
    tags:
      - "postern-mcp-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # The gate this workflow never had (#418 item 3): the Python sibling's
  # tag-vs-version assert is exactly what caught the v1.0.5 pin drift, and an npm
  # publish is irreversible for a given version. It also carries the ancestry
  # assert that used to be inlined in the publish job.
  preflight:
    uses: ./.github/workflows/tag-preflight.yml
    with:
      track: mcp

  publish:
    name: npm publish @skyphusion/postern-mcp
    needs: preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run typecheck && npm test && npm run build

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

name: smoke-staging

# Nightly acceptance smoke against the operator's deployed Postern instance (#25).
# Outbound + store checks only (no inbound MX poll); opt into inbound with
# workflow_dispatch + --expect-inbound when needed.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   POSTERN_SMOKE_BASE_URL   -- e.g. https://postern.example.com
#   POSTERN_SMOKE_API_TOKEN  -- read-scoped bearer (or a both-scoped single key)
#   POSTERN_SMOKE_SEND_TOKEN -- send-scoped bearer (optional; defaults to API token)
#   POSTERN_SMOKE_ORGANIZE_TOKEN -- organize-scoped bearer (optional, #685; unlocks the
#     seen / flags / move round-trip. Unset, leg 6 asserts the 403 refusal instead)
#   POSTERN_SMOKE_NO_ORGANIZE_TOKEN -- a bearer that MUST be refused on the organize
#     routes (optional, #685; unlocks leg 6's regression guard). This is the DEFAULT
#     source for the guard token and the one a self-hoster should set. Unset, leg 6
#     reports its declared GAP rather than asserting anything.
#   POSTERN_SMOKE_DELETE_TOKEN -- delete-scoped bearer (optional; unlocks the smoke's
#                               own leg-10 cleanup so runs leave no debris, #496)
#   POSTERN_SMOKE_IDENTITY_TOKEN -- per-identity send bearer (optional; unlocks the
#                               leg-9 drafts lifecycle, which SKIPs without it; the
#                               leg deletes the draft it creates, so no debris)
#   POSTERN_SMOKE_FROM       -- allowed From address for POST /api/send
#   POSTERN_SMOKE_TO         -- recipient the smoke can address (need not be readable)
#
# Required repo VARIABLE (optional; Settings -> Secrets and variables -> Actions -> Variables):
#   POSTERN_SMOKE_API_TOKEN_IS_READ_ONLY -- set to the string "true" ONLY if this
#     deployment's POSTERN_SMOKE_API_TOKEN is a member of the read set and never the
#     `both` set. It then doubles as the guard token. Leave it unset if your API token
#     is the both-scoped single key this file documents as valid, because a `both` key
#     legitimately organizes and asserting a refusal against it would go red on every
#     run. On THIS deployment it is set, because the dedicated secret's intended value
#     is unrecoverable.
#
# This run is deliberately NOT pinned to an expected version: there is no tag on a
# nightly, and POSTERN_EXPECT_VERSION must be an explicit input rather than something
# the smoke derives for itself. Leg 0 therefore reports a GAP naming what is unpinned.
# That is correct here and it is not noise: a nightly is not racing a deploy, so the
# version it measures is whatever has been live for hours. The deploy path is where the
# race lives, and deploy.yml pins it there. To pin a one-off dispatch, run the script
# by hand with POSTERN_EXPECT_VERSION set.
#
# Skips cleanly when secrets are absent (forks, fresh clones).

on:
  schedule:
    - cron: "0 13 * * *" # 08:00 US/Central (DST-aware enough for ops signal)
  workflow_dispatch:
    inputs:
      expect_inbound:
        description: "Also poll for an inbound message (requires real MX routing)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  smoke:
    name: Postern v1 smoke (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'skyphusion-labs/postern'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Require smoke secrets
        id: gate
        env:
          BASE: ${{ secrets.POSTERN_SMOKE_BASE_URL }}
          TOKEN: ${{ secrets.POSTERN_SMOKE_API_TOKEN }}
          FROM: ${{ secrets.POSTERN_SMOKE_FROM }}
          TO: ${{ secrets.POSTERN_SMOKE_TO }}
        run: |
          if [ -z "$BASE" ] || [ -z "$TOKEN" ] || [ -z "$FROM" ] || [ -z "$TO" ]; then
            echo "Smoke secrets not configured; skipping (expected on forks)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Run inbound/smoke.mjs
        if: steps.gate.outputs.skip != 'true'
        working-directory: inbound
        env:
          POSTERN_BASE_URL: ${{ secrets.POSTERN_SMOKE_BASE_URL }}
          POSTERN_API_TOKEN: ${{ secrets.POSTERN_SMOKE_API_TOKEN }}
          POSTERN_SEND_TOKEN: ${{ secrets.POSTERN_SMOKE_SEND_TOKEN }}
          POSTERN_IDENTITY_TOKEN: ${{ secrets.POSTERN_SMOKE_IDENTITY_TOKEN }}
          POSTERN_DELETE_TOKEN: ${{ secrets.POSTERN_SMOKE_DELETE_TOKEN }}
          POSTERN_ORGANIZE_TOKEN: ${{ secrets.POSTERN_SMOKE_ORGANIZE_TOKEN }}
          # #692: this deployment's guard token is the read-set member that
          # POSTERN_SMOKE_API_TOKEN holds. smoke.mjs deliberately refuses to infer that
          # for itself, and it is right to: a `both`-scoped API token legitimately
          # organizes, so inferring intent from the other variables would fail a valid
          # both-token deployment, and a gate that cries wolf is a gate somebody
          # switches off. Only the operator knows a token's reach, so the claim is made
          # HERE, in this deployment's own wiring, and not in the shared script.
          #
          # Why not the dedicated POSTERN_SMOKE_NO_ORGANIZE_TOKEN secret: its intended
          # value is the read-set member, and that value is UNRECOVERABLE. It lives only
          # in the GitHub secret (write-only), in the Worker's read set (unreadable), and
          # in the crew-secrets minter tier, which has no surviving decryption leg on
          # this estate. The secret name stays documented above for self-hosters, who
          # should set it and point this line at it.
          #
          # Proven against production 2026-10-14, both directions, in CI:
          #   run 38581937323  guard fed an organize-CAPABLE token -> RED at the assert,
          #                    status 200 {"ok":true,"updated":0}, exit 1
          #   run 38582074641  guard fed THIS token -> PASS (403 naming organize),
          #                    56 checks green
          # The failure direction is safe: if this ever becomes a both-scoped token the
          # guard goes RED, never silently green.
          # The guard token must AUTHENTICATE and be REFUSED on organize. Which secret
          # satisfies that is a per-deployment fact only the operator knows, so it is an
          # explicit operator ASSERTION here, never an inference.
          #
          # vars.POSTERN_SMOKE_API_TOKEN_IS_READ_ONLY=true declares that THIS deployment's
          # POSTERN_SMOKE_API_TOKEN is a member of the read set and never the `both` set.
          # Unset or anything else falls back to the dedicated secret, and if that is also
          # unset leg 6 reports its declared GAP rather than asserting anything.
          #
          # Why not map the API token directly: this file documents
          # POSTERN_SMOKE_API_TOKEN as "read-scoped bearer (or a both-scoped single key)",
          # so a both-scoped key is a VALID configuration. A direct mapping would assert a
          # refusal that a valid deployment cannot satisfy, going red on every nightly and
          # every tag deploy. That is the cry-wolf gate smoke.mjs warns about, and the
          # reason it refuses to infer the guard token for itself.
          #
          # Proven in CI against production 2026-10-14, both directions:
          #   run 38581937323  guard fed an organize-CAPABLE token -> RED at the assert,
          #                    status 200 {"ok":true,"updated":0}, exit 1, after legs 1-5 passed
          #   run 38582074641  guard fed the read token -> PASS (403 naming organize),
          #                    56 checks green
          # Both exercised THIS file. deploy.yml carries the identical mapping and is
          # tag-triggered, so it is unexercised until the next release.
          POSTERN_NO_ORGANIZE_TOKEN: ${{ vars.POSTERN_SMOKE_API_TOKEN_IS_READ_ONLY == 'true' && secrets.POSTERN_SMOKE_API_TOKEN || secrets.POSTERN_SMOKE_NO_ORGANIZE_TOKEN }}
          POSTERN_FROM: ${{ secrets.POSTERN_SMOKE_FROM }}
          POSTERN_TO: ${{ secrets.POSTERN_SMOKE_TO }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.expect_inbound || 'false' }}" = "true" ]; then
            ARGS="--expect-inbound"
          fi
          node smoke.mjs $ARGS

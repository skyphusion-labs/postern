name: Adversarial audit

# LLM red-team advisory layer (CodeQL stays the gate).
#   pr   -> @cf/moonshotai/kimi-k2.7-code on merge-base diff
#   repo -> moonshotai/kimi-k3 full tree (workflow_dispatch only; needs CF_AIG_TOKEN)
#
# The audit scripts come from the PUBLIC repo skyphusion-labs/security-audit
# (MIT), pinned by commit SHA below. They used to be checked out of the PRIVATE
# fleet-chezmoi with a read-only deploy key (#436): on a `pull_request` trigger
# GitHub runs the copy of THIS FILE that lives on the PR branch, so that key sat
# in a job any write-access identity could rewrite. Public scripts need no key at
# all, so the credential is simply gone rather than better guarded.
#
# Org secrets: ADVERSARIAL_AUDIT_CF_API_TOKEN (K2.7 /ai/run), CF_AIG_TOKEN (K3 repo mode)
# Org vars:    CLOUDFLARE_ACCOUNT_ID, AI_GATEWAY_ID
#
# Use ADVERSARIAL_AUDIT_CF_API_TOKEN, not secrets.CLOUDFLARE_API_TOKEN: repos with a
# repo-level deploy token for wrangler shadow the org name and lack Workers AI Read.
#
# DATA BOUNDARY (security-audit v0.2.0): `repo` mode ships the whole tracked tree,
# and K3 is proxied to Moonshot's own API rather than run on Workers AI, so the
# script only uses K3 when the repository is PUBLIC and otherwise runs the same
# repo-mode prompt on K2.7 on Workers AI. It resolves visibility from the Actions
# event payload and FAIL-SAFES to private, so nothing needs passing here; postern
# is public, so `repo` mode does use K3.
#
# TRUST MODEL. Deliberate and load-bearing: `pull_request`, never
# pull_request_target; fork PRs skipped by the same-repo gate and secretless
# regardless; advisory only, never a required check; nothing untrusted reaches a
# run: block. Third-party actions are pinned BY COMMIT SHA (a major tag is a
# moving pointer); the version each SHA corresponds to is in the comment beside
# it, and the two are bumped together.
#
# RESIDUAL, still tracked in #436: the two CF tokens above remain in `env:` on a
# job whose definition comes from the PR branch. They are function-scoped AI
# tokens rather than a repo credential, which makes them a lower tier than the
# deploy key that #436 removed, NOT a non-issue. Closing that class needs the
# definition to stop coming from the PR branch (workflow_run).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: pr (K2.7 diff) or repo (K3 full tree)
        required: true
        type: choice
        options:
          - pr
          - repo
        default: pr

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: adversarial-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    # Skip Dependabot by PR AUTHOR, not by github.actor (#420): actor is whoever
    # triggered the latest run, so a human pushing one commit to a dependabot
    # branch used to switch the full audit on for that branch. The author is a
    # property of the PR and does not flip.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # ONE place for the audit-scripts pin (#420), now pointing at the public
      # scripts repo. PUBLIC IS NOT IMMUTABLE: a tag or branch there can move, so
      # this is the v0.2.0 commit SHA, not `main` and not `v0.2.0`. Bump it to a
      # newer tagged SHA from skyphusion-labs/security-audit deliberately.
      AUDIT_SCRIPTS_PIN: ea6b68a80330385f2eecb0f4ec569040fba9c786 # v0.2.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # No credential: skyphusion-labs/security-audit is public, so the default
      # GITHUB_TOKEN reads it and the fleet-chezmoi deploy key is gone (#436).
      - name: Checkout audit scripts (public)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: skyphusion-labs/security-audit
          ref: ${{ env.AUDIT_SCRIPTS_PIN }}
          path: security-audit

      # Read-back, not provenance: it confirms the tree on disk is the commit we
      # asked for, before any of that tree's code executes.
      - name: Verify audit-scripts pin
        working-directory: security-audit
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$AUDIT_SCRIPTS_PIN" ]]; then
            echo "::error::audit-scripts pin mismatch: expected ${AUDIT_SCRIPTS_PIN} got ${actual}"
            exit 1
          fi
          echo "audit-scripts pin OK (${actual:0:7})"

      - name: Run adversarial audit
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.ADVERSARIAL_AUDIT_CF_API_TOKEN }}
          CF_AIG_TOKEN: ${{ secrets.CF_AIG_TOKEN }}
          AI_GATEWAY_ID: ${{ vars.AI_GATEWAY_ID }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AUDIT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'pr' }}
        run: |
          set -euo pipefail
          mode="${AUDIT_MODE}"
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID unset (org variable)"
            exit 2
          fi
          if [[ "$mode" == "pr" && -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::ADVERSARIAL_AUDIT_CF_API_TOKEN required for pr mode (Workers AI Read; do not reuse deploy token)"
            exit 2
          fi
          if [[ "$mode" == "repo" && -z "${CF_AIG_TOKEN:-}" ]]; then
            echo "::error::CF_AIG_TOKEN required for repo mode (Kimi K3 unified billing)"
            exit 2
          fi
          args=(--mode "$mode" --output json --out-file audit.json --md-file audit-report.md --fail-on none)
          node security-audit/adversarial-audit.mjs "${args[@]}"

      - name: Post PR comment (advisory)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          bash security-audit/post-pr-comment.sh \
            "$PR_NUMBER" \
            audit-report.md

      # v4 runs on the deprecated Node 20 runtime; v7 is the current major (same
      # name/path inputs, so this is a runtime bump, not an API change).
      - name: Upload audit artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adversarial-audit
          path: |
            audit.json
            audit-report.md

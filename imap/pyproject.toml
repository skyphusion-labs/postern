[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "posternimap"
version = "0.1.0"
description = "IMAP proxy frontend for Postern: a read-only IMAP view over the Postern mailbox API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "skyphusion" }]
# Runtime dep is Twisted (the IMAP4 server) only; the client + renderer + auth
# core are pure stdlib, so the testable surface needs nothing extra.
# PINNED (audit #107): the old floor (>=22.10) let an install resolve a Twisted
# carrying known advisories. We pin to a single audited version so CI and a fresh
# operator install resolve identically; the pip-audit gate in CI flags this pin the
# moment a new advisory lands, which is the signal to bump it (controlled, visible).
dependencies = ["Twisted==26.4.0"]

[project.optional-dependencies]
# Tests use stdlib unittest only; mypy is the type gate (mirrors the worker's
# `tsc --noEmit` CI gate, house convention).
dev = ["mypy>=1.8"]
# #77 optional auth backends. token/fixed/native need NOTHING beyond stdlib
# (native POSTs to /api/smtp-auth with urllib), so the default install stays
# dependency-light; these extras add a backend only when that mode is used.
#   ldap3:      pure-Python LDAP client (no libldap/C build step), so it is the
#               dependency-light choice over python-ldap for the ldap backend.
#   python-pam: ctypes binding to libpam (no C build step) for the system backend.
# Both are imported LAZILY (auth.py), so importing the package never pulls them.
ldap = ["ldap3>=2.9"]
pam = ["python-pam>=2.0", "six"]  # python-pam 2.0.2 imports six but does not declare it
# Native IMAPS (POSTERN_IMAP_TLS_CERT/KEY) goes through Twisted's TLS stack, which
# needs pyOpenSSL + service-identity. Install .[tls] (or .[pam,tls]) when serving 993.
# Pinned in lockstep with the base Twisted pin above.
tls = ["Twisted[tls]==26.4.0"]

[project.scripts]
postern-imap = "posternimap.__main__:main"

[tool.setuptools]
packages = ["posternimap"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
# Twisted ships partial stubs; do not fail the gate on its untyped internals.
ignore_missing_imports = true
files = ["posternimap"]
# postern#680: check the BODY of untyped functions too (most test methods have no
# annotations, so mypy skipped them). The modules below still fail with it on and are
# DEFERRED, not fixed: 272 errors in 25 test modules (python -m mypy --check-untyped-defs,
# mypy 2.4.0, Python 3.14; the two production modules were fixed in #696). Each override
# is one module and is meant to be deleted as that module is fixed. Do not add a module here; new code is checked.
check_untyped_defs = true

# postern#680 deferred modules (error count each, at the time of enabling).
[[tool.mypy.overrides]]
module = [
    "posternimap.tests.test_server_e2e",  # 57
    "posternimap.tests.test_rfc822",  # 48
    "posternimap.tests.test_auth_backends",  # 25
    "posternimap.tests.test_serialization",  # 23
    "posternimap.tests.test_mailbox",  # 21
    "posternimap.tests.test_header_one_string_e2e",  # 11
    "posternimap.tests.test_auth",  # 10
    "posternimap.tests.test_utf8_accept_e2e",  # 10
    "posternimap.tests.test_worker_contract",  # 9
    "posternimap.tests.test_breaker",  # 7
    "posternimap.tests.test_reactor_surface",  # 7
    "posternimap.tests.test_http_transport",  # 6
    "posternimap.tests.test_reactor_nonblocking",  # 6
    "posternimap.tests.test_size_literal_e2e",  # 5
    "posternimap.tests.test_roles_fetch",  # 4
    "posternimap.tests.test_throttle",  # 4
    "posternimap.tests.test_client",  # 3
    "posternimap.tests.test_pool_saturation",  # 3
    "posternimap.tests.test_bodystructure_filename_e2e",  # 2
    "posternimap.tests.test_list_wildcard",  # 2
    "posternimap.tests.test_per_account",  # 2
    "posternimap.tests.test_proxywrap",  # 2
    "posternimap.tests.test_snapshot_stability",  # 2
    "posternimap.tests.test_tls",  # 2
    "posternimap.tests.test_role_folders",  # 1
]
check_untyped_defs = false
